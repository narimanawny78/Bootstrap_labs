<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  </head>
  <body>
    <div class="register">
      <div class="container">
        <h2 class="mt-4 mb-5 text-center">REGISTRATION FORM</h2>
        <form class="row g-3">
          <div class="col-md-4">
            <label for="validationDefault01" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="validationDefault01" placeholder="Enter your name" required>
          </div>
          <div class="col-md-4">
            <label for="validationDefaultUsername" class="form-label">Email</label>
            <div class="input-group">
              <span class="input-group-text" id="inputGroupPrepend2">@</span>
              <input type="text" class="form-control" id="validationDefaultUsername" placeholder="Enter your email" aria-describedby="inputGroupPrepend2" required>
            </div>
          </div>
          <div class="col-md-4">
            <label for="validationDefault02" class="form-label">Phone Number</label>
            <input type="tel" class="form-control" id="validationDefault02" placeholder="Enter you phone" required>
          </div>
          <div class="col-md-6">
            <label for="inputPassword5" class="form-label">Password</label>
            <input type="password" id="inputPassword5" class="form-control" aria-describedby="passwordHelpBlock">
            <div id="passwordHelpBlock" class="form-text">
              Your password must be 8-20 characters long, contain letters and numbers, and must not contain spaces, special
              characters, or emoji.
            </div>
          <div class="col-md-6">
            <label for="inputPassword6" class="form-label">Confirm Password</label>
            <input type="password" id="inputPassword6" class="form-control" aria-describedby="passwordHelpBlock">
            <div id="ConfirmpasswordHelpBlock" class="form-text">
              Your password must be 8-20 characters long, contain letters and numbers, and must not contain spaces, special
              characters, or emoji.
            </div>
          </div>
          <div class="col-md-3 mt-3 mb-3">
            <label for="validationDefault05" class="form-label">Gender</label>
            <!-- <input type="text" class="form-control" id="validationDefault05" required> -->
            <div class="form-check">
              <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1">
              <label class="form-check-label" for="radioDefault1">
                Female
              </label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault2" checked>
              <label class="form-check-label" for="radioDefault2">
                Male
              </label>
            </div>
          </div>
          <div class="col-12">
            <a href="login.html" class="btn btn-primary" type="submit">Submit form</a>
          </div>
        </form>
      </div>
  </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
  </body>
</html>
